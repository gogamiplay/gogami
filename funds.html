<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GOGAMI - Funds & Passbook</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            outline: none;
            border: none;
        }

        body { 
            background: #f0f6ff; 
            color: #1e293b; 
            padding-bottom: 90px; 
            min-height: 100vh;
        }

        .app-container { 
            max-width: 480px; 
            margin: 0 auto; 
            background: #f0f6ff; 
            min-height: 100vh; 
            position: relative; 
        }

        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #025922;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .splash-logo {
            width: 150px;
            height: 150px;
            object-fit: contain;
            margin-bottom: 30px;
        }

        .loader-bar {
            width: 120px;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .loader-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: #ffffff;
            border-radius: 10px;
            animation: loading 1.2s infinite linear;
        }

        @keyframes loading {
            0% { left: -100%; }
            50% { left: 0%; }
            100% { left: 100%; }
        }

        #depositLoadingOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(2, 89, 34, 0.92);
            z-index: 6000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        .spinner-circle {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .deposit-loading-text {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .sticky-top-panel {
            position: fixed; 
            top: 0; 
            left: 0; 
            right: 0; 
            max-width: 480px; 
            margin: 0 auto;
            min-height: 120px;
            background: #025922; 
            color: #fff; 
            z-index: 1000;
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            padding: 12px 16px; 
            border-bottom: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header-action-line { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            gap: 12px; 
            width: 100%; 
        }

        .menu-btn { 
            background: none; 
            border: none; 
            color: #fff; 
            font-size: 24px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
        }

        .header-logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            max-height: 36px;
        }

        .header-logo-img {
            height: 34px;
            max-width: 120px;
            object-fit: contain;
            display: block;
        }

        .action-shortcuts { display: flex; gap: 6px; align-items: center; }
        
        .shortcut-btn { 
            background: #013b15; 
            color: #fff; 
            padding: 6px 10px; 
            border-radius: 10px; 
            font-size: 11px; 
            font-weight: 700; 
            text-decoration: none; 
            text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.15);
            cursor: pointer;
        }

        .balance-box { 
            background: #013b15; 
            padding: 6px 10px; 
            border-radius: 10px; 
            color: #34d399; 
            font-weight: 800; 
            font-size: 12px; 
            cursor: pointer; 
            border: 1px solid rgba(255,255,255,0.15);
        }

        .panel-info-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-end; 
            border-top: 1px solid rgba(255,255,255,0.15); 
            padding-top: 8px; 
            margin-top: 10px;
        }

        .user-meta { display: flex; flex-direction: column; gap: 2px; }
        .user-meta .name { font-size: 14px; font-weight: 700; color: #f8fafc; }
        .user-meta .phone { font-size: 11px; color: #cbd5e1; font-weight: 600; }
        .funds-header-label { font-size: 11px; font-weight: 700; color: #34d399; text-transform: uppercase; letter-spacing: 0.5px; }

        .main-scroll-content { margin-top: 125px; padding: 14px; }
        .section-title { font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.8px; margin: 16px 4px 10px 4px; }

        .fund-card { 
            background: #ffffff; 
            border-radius: 18px; 
            padding: 18px; 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
            margin-bottom: 14px; 
            border: 1px solid #cbd5e1;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .fund-row-details { display: flex; justify-content: space-between; align-items: center; }
        .fund-title { font-size: 15px; font-weight: 700; color: #0f172a; }
        
        .fund-action-btn { 
            padding: 12px 24px; 
            background: #025922; 
            border: none; 
            border-radius: 12px; 
            color: #fff; 
            font-weight: 700; 
            cursor: pointer; 
            font-size: 12px; 
            letter-spacing: 0.5px; 
            text-transform: uppercase; 
            text-decoration: none; 
            text-align: center; 
        }

        .btn-withdraw-theme { background: #059669; }

        .form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .form-label { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; }
        .form-input-field { background: #f8fafc; border-radius: 12px; padding: 12px 14px; border: 1px solid #cbd5e1; }
        .form-input { 
            width: 100%; 
            background: transparent; 
            border: none; 
            outline: none; 
            font-size: 14px; 
            font-weight: 600; 
            color: #0f172a; 
        }

        .history-list { display: flex; flex-direction: column; gap: 8px; }
        .history-item { 
            background: #ffffff; 
            border-radius: 14px; 
            padding: 14px 16px; 
            display: flex; 
            flex-direction: column;
            gap: 6px;
            border: 1px solid #cbd5e1;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }
        .history-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 6px; }
        .history-id { color: #0284c7; font-size: 11px; font-family: monospace; font-weight: 700; }
        .history-amount { font-size: 16px; font-weight: 800; }
        .amount-credit { color: #059669; }
        .amount-debit { color: #dc2626; }
        .history-row { display: flex; justify-content: space-between; align-items: center; }
        .history-type { font-size: 10px; padding: 3px 8px; border-radius: 6px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        .type-deposit { background: rgba(5, 150, 105, 0.15); color: #059669; }
        .type-withdraw { background: rgba(220, 38, 38, 0.15); color: #dc2626; }
        .status-text { font-size: 11px; font-weight: 800; text-transform: uppercase; }
        .status-completed, .status-approved, .status-success { color: #059669; }
        .status-rejected { color: #dc2626; }
        .status-pending { color: #d97706; }
        .history-date { color: #64748b; font-size: 10px; font-weight: 500; text-align: right; }

        .bottom-nav { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            max-width: 480px; 
            margin: 0 auto; 
            background: #ffffff; 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            padding: 6px 10px 8px 10px; 
            border-top: 1px solid #e2e8f0; 
            z-index: 1000; 
            height: 72px; 
        }

        .nav-item { 
            text-align: center; 
            cursor: pointer; 
            font-size: 9px; 
            flex: 1; 
            font-weight: 800; 
            text-decoration: none; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            position: relative;
            top: -16px; 
            background: #025922; 
            color: #fff !important; 
            width: 58px; 
            height: 58px; 
            border-radius: 50%; 
            border: 4px solid #ffffff; 
            text-transform: uppercase; 
        }

        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0, 0, 0, 0.6); 
            z-index: 2000; 
            justify-content: center; 
            align-items: center; 
        }

        .modal-content { 
            background: #ffffff; 
            border-radius: 20px; 
            padding: 24px; 
            width: 90%; 
            max-width: 340px; 
        }
        .modal-btn { width: 100%; padding: 14px; background: #025922; border: none; border-radius: 12px; color: #fff; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .close-modal { background: #e2e8f0; color: #334155; }
    </style>
</head>
<body>

<div id="splashScreen">
    <img src="https://i.imgur.com/DEFyMFt.png" alt="Logo" class="splash-logo">
    <div class="loader-bar"></div>
</div>

<div id="depositLoadingOverlay">
    <div class="spinner-circle"></div>
    <div class="deposit-loading-text">Processing Deposit...</div>
</div>

<div class="app-container">
    <div class="sticky-top-panel">
        <div class="header-action-line">
            <button class="menu-btn" onclick="showProfileModal()">☰</button>
            <div class="header-logo-container">
                <img src="https://i.imgur.com/DEFyMFt.png" alt="GOGAMI Logo" class="header-logo-img">
            </div>
            <div class="action-shortcuts">
                <button onclick="handleDepositClick()" class="shortcut-btn">Deposit</button>
                <a href="withdraw.html" class="shortcut-btn">Withdraw</a>
                <div class="balance-box" onclick="showBalance()">₹<span id="userBalance">0</span></div>
            </div>
        </div>
        <div class="panel-info-row">
            <div class="user-meta">
                <div class="name" id="profileName">Loading...</div>
                <div class="phone" id="profilePhone">Loading...</div>
            </div>
            <div class="funds-header-label">Wallet & Banking</div>
        </div>
    </div>
    
    <div class="main-scroll-content">
        <div class="section-title">Funding Shortcuts</div>
        
        <div class="fund-card">
            <div class="fund-row-details">
                <div class="fund-title">Deposit</div>
                <button onclick="handleDepositClick()" class="fund-action-btn">Deposit</button>
            </div>
        </div>

        <div class="fund-card">
            <div class="fund-row-details">
                <div class="fund-title">Withdraw</div>
                <a href="withdraw.html" class="fund-action-btn btn-withdraw-theme">Withdraw</a>
            </div>
        </div>

        <div class="section-title">Bank Account Details</div>
        <div class="fund-card">
            <div class="fund-row-details">
                <div class="fund-title">Manage Bank Account</div>
                <button onclick="showBankModal()" class="fund-action-btn">Add Bank Details</button>
            </div>
        </div>

        <div class="section-title">Recent Transaction History</div>
        <div class="history-list" id="transactionHistoryList">
            <div style="text-align:center; padding:20px; color:#64748b;">Loading...</div>
        </div>
    </div>
    
    <div class="bottom-nav">
        <a href="chart.html" class="nav-item"><span>Chart</span></a>
        <a href="mybids.html" class="nav-item"><span>My Bids</span></a>
        <a href="dashboard.html" class="nav-item"><span>Home</span></a>
        <a href="funds.html" class="nav-item"><span>Fund</span></a>
        <a href="chat.html" class="nav-item"><span>Support</span></a>
    </div>
</div>

<!-- Profile Modal -->
<div id="profileModal" class="modal">
    <div class="modal-content">
        <h3>My Profile</h3>
        <div id="profileInfo"></div>
        <button class="modal-btn logout-btn" onclick="logout()">🚪 Logout</button>
        <button class="modal-btn close-modal" onclick="closeProfileModal()">Close</button>
    </div>
</div>

<!-- Bank Details Modal -->
<div id="bankModal" class="modal">
    <div class="modal-content">
        <h3>Add Bank Details</h3>
        <div class="form-row" style="margin-top: 12px;">
            <label class="form-label">Account Holder Name</label>
            <div class="form-input-field"><input type="text" id="bankAccountHolder" class="form-input" placeholder="Enter name"></div>
        </div>
        <div class="form-row">
            <label class="form-label">Bank Name</label>
            <div class="form-input-field"><input type="text" id="bankName" class="form-input" placeholder="Enter bank name"></div>
        </div>
        <div class="form-row">
            <label class="form-label">Account Number</label>
            <div class="form-input-field"><input type="text" id="bankAccountNumber" class="form-input" placeholder="Enter number" inputmode="numeric"></div>
        </div>
        <div class="form-row">
            <label class="form-label">IFSC Code</label>
            <div class="form-input-field"><input type="text" id="bankIfsc" class="form-input" placeholder="Enter IFSC"></div>
        </div>
        <button class="modal-btn" onclick="saveBankDetails()">Update Bank Details</button>
        <button class="modal-btn close-modal" onclick="closeBankModal()">Close</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDLZdlEN9SEb6Z4dsuuMGsRNIzVBMwky_c",
        authDomain: "gogami-877be.firebaseapp.com",
        databaseURL: "https://gogami-877be-default-rtdb.firebaseio.com",
        projectId: "gogami-877be",
        storageBucket: "gogami-877be.firebasestorage.app",
        messagingSenderId: "220921167245",
        appId: "1:220921167245:web:3ccc8b424e5bc927c291c4",
        measurementId: "G-2Q572T3D8J"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(), db = firebase.firestore();

    window.handleDepositClick = function() {
        const loadingOverlay = document.getElementById('depositLoadingOverlay');
        if (loadingOverlay) loadingOverlay.style.display = 'flex';
        
        setTimeout(() => {
            const user = auth.currentUser;
            const uid = user ? user.uid : "";
            window.location.href = `https://www.gogamienterprises.co.in/payment.html?userid=${uid}`;
        }, 800);
    };

    function hideSplashScreen() {
        const splash = document.getElementById('splashScreen');
        if (splash) { splash.style.opacity = '0'; setTimeout(() => splash.style.visibility = 'hidden', 300); }
    }
    
    async function loadUserData() {
        const user = auth.currentUser;
        if (!user) { window.location.href = 'index.html'; return; }
        const doc = await db.collection('users').doc(user.uid).get();
        if (doc.exists) { 
            let data = doc.data();
            document.getElementById('userBalance').innerText = data.balance || 0; 
            document.getElementById('profileName').innerText = data.name || 'User'; 
            document.getElementById('profilePhone').innerText = data.phone || ''; 
            
            if (data.bankDetails) {
                document.getElementById('bankAccountHolder').value = data.bankDetails.accountHolder || '';
                document.getElementById('bankName').value = data.bankDetails.bankName || '';
                document.getElementById('bankAccountNumber').value = data.bankDetails.accountNumber || '';
                document.getElementById('bankIfsc').value = data.bankDetails.ifscCode || '';
            }
            loadTransactionHistory(user.uid);
        }
        hideSplashScreen();
    }

    async function saveBankDetails() {
        let ah = document.getElementById('bankAccountHolder').value.trim();
        let bn = document.getElementById('bankName').value.trim();
        let an = document.getElementById('bankAccountNumber').value.trim();
        let ifsc = document.getElementById('bankIfsc').value.trim();
        if(!ah || !bn || !an || !ifsc) { alert('⚠️ Fill all fields.'); return; }
        try {
            await db.collection('users').doc(auth.currentUser.uid).update({
                bankDetails: { accountHolder: ah, bankName: bn, accountNumber: an, ifscCode: ifsc }
            });
            alert('✅ Details saved!');
            closeBankModal();
        } catch(e) { alert('Error: ' + e.message); }
    }

    async function loadTransactionHistory(uid) {
        const container = document.getElementById('transactionHistoryList');
        try {
            let transactionsSnap = await db.collection('transactions').get();
            let withdrawalsSnap = await db.collection('withdrawRequests').where('userId', '==', uid).get();

            let items = [];

            withdrawalsSnap.forEach(doc => {
                let w = doc.data();
                let date = w.date?.toDate ? w.date.toDate() : (w.date?.seconds ? new Date(w.date.seconds * 1000) : (w.timestamp?.toDate ? w.timestamp.toDate() : new Date(0)));
                
                let rawStatus = (w.status || 'Pending').toLowerCase();
                let displayStatus = 'Pending';
                if (rawStatus === 'rejected' || rawStatus === 'cancel' || rawStatus === 'cancelled') {
                    displayStatus = 'Rejected';
                } else if (rawStatus === 'completed' || rawStatus === 'approved' || rawStatus === 'success') {
                    displayStatus = 'Approved';
                }

                items.push({
                    id: doc.id,
                    type: 'debit',
                    category: 'Withdrawal',
                    amount: w.amount,
                    status: displayStatus,
                    date: date
                });
            });

            transactionsSnap.forEach(doc => {
                let t = doc.data();
                let tUserId = t.userId || t.userid;
                if (tUserId === uid) {
                    let date = t.timestamp?.toDate ? t.timestamp.toDate() : (t.timestamp?.seconds ? new Date(t.timestamp.seconds * 1000) : (t.date?.toDate ? t.date.toDate() : (t.date?.seconds ? new Date(t.date.seconds * 1000) : new Date(0))));
                    
                    let rawStatus = (t.status || (t.razorpayPaymentId ? 'Success' : 'Completed')).toLowerCase();
                    let displayStatus = 'Completed';
                    if (rawStatus === 'rejected') displayStatus = 'Rejected';
                    else if (rawStatus === 'pending') displayStatus = 'Pending';
                    else if (rawStatus === 'success' || rawStatus === 'completed' || rawStatus === 'approved') displayStatus = 'Success';

                    items.push({
                        id: doc.id,
                        type: 'credit',
                        category: t.razorpayPaymentId ? 'Online Deposit' : 'Deposit',
                        amount: t.amount,
                        status: displayStatus,
                        date: date
                    });
                }
            });

            items.sort((a, b) => b.date - a.date);

            if (items.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:#64748b;">No transactions found</div>';
                return;
            }

            let html = items.map(item => {
                let isCredit = item.type === 'credit';
                let statusLower = item.status.toLowerCase();
                let statusClass = (statusLower === 'completed' || statusLower === 'approved' || statusLower === 'success') ? 'status-completed' : (statusLower === 'rejected' ? 'status-rejected' : 'status-pending');

                return `
                    <div class="history-item">
                        <div class="history-header">
                            <span class="history-id">REF: #${item.id.substring(0, 10).toUpperCase()}</span>
                            <span class="history-amount ${isCredit ? 'amount-credit' : 'amount-debit'}">
                                ${isCredit ? '+' : '-'} ₹${item.amount}
                            </span>
                        </div>
                        <div class="history-row">
                            <span class="history-type ${isCredit ? 'type-deposit' : 'type-withdraw'}">${item.category}</span>
                            <span class="status-text ${statusClass}">${item.status}</span>
                        </div>
                        <div class="history-date">📅 ${item.date.getTime() > 0 ? item.date.toLocaleString() : 'Pending'}</div>
                    </div>`;
            }).join('');

            container.innerHTML = html;
        } catch (e) {
            container.innerHTML = `<div style="text-align:center; padding:20px; color:#dc2626;">Error: ${e.message}</div>`;
        }
    }

    function showProfileModal() { document.getElementById('profileModal').style.display='flex'; }
    function closeProfileModal() { document.getElementById('profileModal').style.display='none'; }
    function showBankModal() { document.getElementById('bankModal').style.display='flex'; }
    function closeBankModal() { document.getElementById('bankModal').style.display='none'; }
    function logout() { auth.signOut().then(() => window.location.href='index.html'); }
    
    auth.onAuthStateChanged(user => { if(!user) window.location.href='index.html'; else loadUserData(); });
    setTimeout(hideSplashScreen, 3000);
</script>
</body>
</html>
